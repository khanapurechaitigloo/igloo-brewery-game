<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igloo Brewery — Interactive Brew</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d1a;
    color: #e0d8c8;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(180deg, #1a1a2e, #12121f);
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 18px;
    color: #ffd08a;
    text-shadow: 0 0 10px rgba(255,160,50,0.3);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .timer {
    font-size: 20px;
    font-weight: bold;
    color: #ff6b6b;
    font-variant-numeric: tabular-nums;
  }
  .score {
    font-size: 16px;
    color: #7dde92;
    font-weight: bold;
  }
  .btn-close {
    background: none;
    border: 1px solid #555;
    color: #aaa;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-close:hover { border-color: #ff6b6b; color: #ff6b6b; }

  /* Step tabs */
  .step-tabs {
    display: flex;
    padding: 6px 8px;
    background: #12121f;
    border-bottom: 1px solid #2a2a3a;
    gap: 2px;
    flex-shrink: 0;
    overflow-x: auto;
  }
  .step-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 50px;
    border: 1px solid transparent;
  }
  .step-tab:hover { background: rgba(255,255,255,0.05); }
  .step-tab.active {
    background: rgba(196,122,44,0.15);
    border-color: #c47a2c;
  }
  .step-tab.done {
    background: rgba(46,204,113,0.1);
  }
  .step-tab .icon { font-size: 20px; }
  .step-tab .label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
    color: #888;
  }
  .step-tab.active .label { color: #ffd08a; }
  .step-tab.done .label { color: #7dde92; }

  /* Game area */
  .game-area {
    flex: 1;
    position: relative;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .game-canvas {
    height: 100%;
    min-width: 1200px;
    position: relative;
  }

  /* Equipment cards */
  .equipment {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: filter 0.3s;
  }
  .equipment.inactive { filter: brightness(0.4); }
  .equipment.active { filter: brightness(1.1); }

  .machine {
    width: 100px;
    height: 120px;
    border-radius: 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid #444;
    background: linear-gradient(180deg, #2a2a3a, #1a1a2a);
    transition: all 0.3s;
  }
  .machine.active {
    border-color: #ffd08a;
    box-shadow: 0 0 15px rgba(255,208,138,0.2);
  }
  .machine .body {
    width: 70px;
    height: 80px;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  .machine .liquid {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 0%;
    transition: height 0.5s;
    border-radius: 0 0 4px 4px;
  }
  .machine .liquid.filling { height: 70%; }

  /* Controls */
  .controls {
    margin-top: 8px;
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .btn-control {
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #2a2a3a;
    color: #ddd;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-control:hover { border-color: #ffd08a; color: #ffd08a; }
  .btn-control.active { background: #c47a2c; border-color: #ffd08a; color: #fff; }

  .lever {
    width: 12px;
    height: 40px;
    background: #555;
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
  }
  .lever.pulled { background: #4a9eff; }
  .lever::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 8px;
    background: #888;
    border-radius: 2px;
    left: -3px;
    top: 4px;
    transition: top 0.2s, background 0.2s;
  }
  .lever.pulled::after { top: 28px; background: #4a9eff; }

  .toggle {
    width: 36px;
    height: 20px;
    background: #333;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
  }
  .toggle.on { background: #4a9eff; }
  .toggle::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    background: #ddd;
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: left 0.2s;
  }
  .toggle.on::after { left: 18px; }

  .speed-control {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .speed-btn {
    width: 20px;
    height: 14px;
    background: #2a2a3a;
    border: 1px solid #555;
    color: #aaa;
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
  }
  .speed-btn:hover { border-color: #ffd08a; }
  .speed-val {
    font-size: 14px;
    font-weight: bold;
    color: #ffd08a;
    min-width: 20px;
    text-align: center;
  }

  /* Pipe connections */
  .pipe {
    position: absolute;
    top: 50%;
    height: 8px;
    background: linear-gradient(180deg, #666, #444, #666);
    border-radius: 4px;
    transform: translateY(-50%);
    z-index: 0;
  }
  .pipe.flowing {
    background: linear-gradient(180deg, #666, #4a9eff, #666);
    box-shadow: 0 0 8px rgba(74,158,255,0.3);
  }

  /* Message bar */
  .message-bar {
    padding: 10px 16px;
    background: #12121f;
    border-top: 1px solid #2a2a3a;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .message {
    font-size: 13px;
    color: #aaa;
  }
  .message strong { color: #ffd08a; }
  .message .err { color: #ff6b6b; }
  .message .ok { color: #7dde92; }

  .btn-reset {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #2a2a3a;
    color: #ddd;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-reset:hover { border-color: #ffd08a; }

  /* Celebration */
  .celebrate {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 16px;
  }
  .celebrate.show { display: flex; }
  .celebrate h2 { font-size: 32px; color: #ffd08a; }
  .celebrate .final-score { font-size: 48px; color: #7dde92; font-weight: bold; }
  .celebrate .btn-play {
    padding: 12px 32px;
    border-radius: 8px;
    background: #c47a2c;
    color: #fff;
    border: none;
    font-size: 16px;
    cursor: pointer;
  }
  .celebrate .btn-exit {
    padding: 10px 24px;
    border-radius: 8px;
    background: transparent;
    color: #aaa;
    border: 1px solid #555;
    font-size: 14px;
    cursor: pointer;
  }

  /* Steam particles */
  .steam {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(200,200,220,0.4);
    border-radius: 50%;
    pointer-events: none;
    animation: steam-rise 1.5s ease-out forwards;
  }
  @keyframes steam-rise {
    0% { opacity: 0.6; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(2); }
  }

  /* Scroll hint */
  .scroll-hint {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #555;
    font-size: 11px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }
</style>
</head>
<body>

<div class="header">
  <h1>🍺 Igloo Brewery — Interactive Brew</h1>
  <div class="header-right">
    <div class="score" id="score">0 L</div>
    <div class="timer" id="timer">3:00</div>
    <button class="btn-close" onclick="closeBrewery()">✕</button>
  </div>
</div>

<div class="step-tabs" id="step-tabs"></div>

<div class="game-area" id="game-area">
  <div class="game-canvas" id="game-canvas"></div>
  <div class="scroll-hint">← Scroll to see all equipment →</div>
</div>

<div class="message-bar">
  <div class="message" id="msg"><strong>Welcome!</strong> Click the 🌾 Grain Silo to start brewing.</div>
  <button class="btn-reset" onclick="brewReset()">🔄 Reset</button>
</div>

<div class="celebrate" id="brew-celebrate">
  <h2>🎉 Brewing Complete!</h2>
  <div class="final-score" id="final-score">0 L</div>
  <p style="color:#aaa">You produced <span id="final-k">0</span> kegs of Igloo Craft Beer!</p>
  <div style="display:flex;gap:12px;margin-top:12px;">
    <button class="btn-play" onclick="brewReset(); document.getElementById('brew-celebrate').classList.remove('show');">🔄 Brew Again</button>
    <button class="btn-exit" onclick="closeBrewery(); document.getElementById('brew-celebrate').classList.remove('show');">✕ Exit Brewery</button>
  </div>
</div>

<script>
// ─── Brew Steps ───
const brewSteps = [
  { id:'grain',   label:'Grain',   icon:'🌾', color:'#a0a0a0', liquidColor:'#d4a843', control:'lever',   desc:'Malted barley storage' },
  { id:'mill',    label:'Mill',    icon:'⚙️', color:'#c47a2c', liquidColor:'#b8944a', control:'button',  desc:'Crush grain into grist' },
  { id:'mash',    label:'Mash',    icon:'💧', color:'#8a8a8a', liquidColor:'#b8944a', control:'toggle',  desc:'65°C — convert starch to sugar' },
  { id:'lauter',  label:'Lauter',  icon:'🔪', color:'#9a9a9a', liquidColor:'#d4b06a', control:'toggle',  desc:'Separate sweet wort from grain' },
  { id:'brew',    label:'Brew',    icon:'🔥', color:'#aaaaaa', liquidColor:'#ff8c00', control:'button',  desc:'100°C boil with hops' },
  { id:'cool',    label:'Cool',    icon:'❄️', color:'#7a9aaa', liquidColor:'#5a9aaa', control:'toggle',  desc:'Rapid cool to 18°C' },
  { id:'ferment', label:'Ferment', icon:'🫧', color:'#8a8a8a', liquidColor:'#daa520', control:'lever',   desc:'Yeast converts sugar to alcohol' },
  { id:'condition',label:'Condition',icon:'⏳',color:'#9a9a9a',liquidColor:'#c89838', control:'lever',   desc:'Maturation & cold settling' },
  { id:'filter',  label:'Filter',  icon:'🔬', color:'#888888', liquidColor:'#e8c860', control:'button',  desc:'Polish clarity before packaging' },
  { id:'package', label:'Package', icon:'🍺', color:'#7a7a7a', liquidColor:'#daa520', control:'keg',     desc:'Fill kegs for the taproom' },
];

// ─── State ───
let brewStep = 0;
let brewScore = 0;
let brewTimeLeft = 180; // 3 minutes
let brewTimerInterval = null;
let brewActive = false;
let brewStepStates = {};
let brewSpeeds = {};

// ─── Init ───
function initBrewGame() {
  brewStep = 0;
  brewScore = 0;
  brewTimeLeft = 180;
  brewActive = false;
  brewStepStates = {};
  brewSpeeds = {};
  brewSteps.forEach(s => { brewStepStates[s.id] = false; brewSpeeds[s.id] = 1; });

  // Build tabs
  const tabsEl = document.getElementById('step-tabs');
  tabsEl.innerHTML = '';
  brewSteps.forEach((step, i) => {
    const tab = document.createElement('div');
    tab.className = 'step-tab' + (i === 0 ? ' active' : '');
    tab.id = 'tab-' + step.id;
    tab.innerHTML = `<span class="icon">${step.icon}</span><span class="label">${step.label}</span>`;
    tab.onclick = () => selectStep(i);
    tabsEl.appendChild(tab);
  });

  // Build equipment
  buildEquipment();

  // Update UI
  updateScore();
  updateTimer();
  setMessage('<strong>Welcome!</strong> Click the 🌾 Grain Silo to start brewing.');

  // Start timer
  if (brewTimerInterval) clearInterval(brewTimerInterval);
  brewTimerInterval = setInterval(() => {
    if (!brewActive) return;
    brewTimeLeft--;
    updateTimer();
    if (brewTimeLeft <= 0) endGame();
  }, 1000);
}

function buildEquipment() {
  const canvas = document.getElementById('game-canvas');
  canvas.innerHTML = '';

  const startX = 40;
  const gapX = 130;

  brewSteps.forEach((step, i) => {
    const x = startX + i * gapX;

    // Equipment container
    const eq = document.createElement('div');
    eq.className = 'equipment inactive';
    eq.id = 'eq-' + step.id;
    eq.style.left = x + 'px';

    // Machine
    const machine = document.createElement('div');
    machine.className = 'machine';
    machine.id = 'machine-' + step.id;

    // Body with liquid
    const body = document.createElement('div');
    body.className = 'body';
    body.style.background = `linear-gradient(180deg, ${step.color}, ${darken(step.color, 30)})`;

    const liquid = document.createElement('div');
    liquid.className = 'liquid';
    liquid.id = 'liquid-' + step.id;
    liquid.style.background = `linear-gradient(180deg, ${step.liquidColor}cc, ${step.liquidColor})`;
    body.appendChild(liquid);
    machine.appendChild(body);

    // Icon overlay
    const icon = document.createElement('div');
    icon.style.cssText = 'font-size:28px;margin-top:4px;position:relative;z-index:1;';
    icon.textContent = step.icon;
    machine.appendChild(icon);

    eq.appendChild(machine);

    // Controls
    const controls = document.createElement('div');
    controls.className = 'controls';
    controls.id = 'controls-' + step.id;

    if (step.control === 'lever') {
      const lever = document.createElement('div');
      lever.className = 'lever';
      lever.id = 'lever-' + step.id;
      lever.onclick = () => pullLever(step.id, i);
      controls.appendChild(lever);
    } else if (step.control === 'toggle') {
      const toggle = document.createElement('div');
      toggle.className = 'toggle';
      toggle.id = 'toggle-' + step.id;
      toggle.onclick = () => toggleSwitch(step.id, i);
      controls.appendChild(toggle);
    } else if (step.control === 'button') {
      const btn = document.createElement('div');
      btn.className = 'btn-control';
      btn.id = 'btn-' + step.id;
      btn.textContent = '▶ START';
      btn.onclick = () => pressButton(step.id, i);
      controls.appendChild(btn);
    } else if (step.control === 'keg') {
      const speedCtrl = document.createElement('div');
      speedCtrl.className = 'speed-control';
      speedCtrl.innerHTML = `
        <div class="speed-btn" onclick="changeSpeed('${step.id}',1)">▲</div>
        <div class="speed-val" id="speed-${step.id}">1</div>
        <div class="speed-btn" onclick="changeSpeed('${step.id}',-1)">▼</div>
      `;
      controls.appendChild(speedCtrl);
    }

    eq.appendChild(controls);
    canvas.appendChild(eq);

    // Pipe to next
    if (i < brewSteps.length - 1) {
      const pipe = document.createElement('div');
      pipe.className = 'pipe';
      pipe.id = 'pipe-' + i;
      pipe.style.left = (x + 108) + 'px';
      pipe.style.width = (gapX - 16) + 'px';
      canvas.appendChild(pipe);
    }
  });
}

// ─── Controls ───
function pullLever(id, index) {
  if (index !== brewStep) { setMessage('<span class="err">Not yet!</span> Next step: <strong>' + brewSteps[brewStep].label + '</strong>'); return; }
  const lever = document.getElementById('lever-' + id);
  lever.classList.toggle('pulled');
  if (lever.classList.contains('pulled')) activateStep(id, index);
}

function toggleSwitch(id, index) {
  if (index !== brewStep) { setMessage('<span class="err">Not yet!</span> Next step: <strong>' + brewSteps[brewStep].label + '</strong>'); return; }
  const toggle = document.getElementById('toggle-' + id);
  toggle.classList.toggle('on');
  if (toggle.classList.contains('on')) activateStep(id, index);
}

function pressButton(id, index) {
  if (index !== brewStep) { setMessage('<span class="err">Not yet!</span> Next step: <strong>' + brewSteps[brewStep].label + '</strong>'); return; }
  const btn = document.getElementById('btn-' + id);
  btn.classList.add('active');
  btn.textContent = '✅ ACTIVE';
  activateStep(id, index);
}

function changeSpeed(id, delta) {
  brewSpeeds[id] = Math.max(1, Math.min(3, (brewSpeeds[id] || 1) + delta));
  document.getElementById('speed-' + id).textContent = brewSpeeds[id];
  if (brewSpeeds[id] >= 2) activateStep(id, brewSteps.findIndex(s => s.id === id));
}

function activateStep(id, index) {
  brewStepStates[id] = true;
  brewActive = true;

  // Visual feedback
  const eq = document.getElementById('eq-' + id);
  eq.classList.remove('inactive');
  eq.classList.add('active');
  document.getElementById('liquid-' + id).classList.add('filling');
  document.getElementById('tab-' + id).classList.remove('active');
  document.getElementById('tab-' + id).classList.add('done');

  // Pipe flow
  if (index < brewSteps.length - 1) {
    document.getElementById('pipe-' + index).classList.add('flowing');
  }

  // Add score
  const liters = 5 + Math.floor(Math.random() * 5);
  brewScore += liters;
  updateScore();

  // Steam effect for brewing
  if (id === 'brew') spawnSteam('machine-' + id);

  // Advance
  if (index < brewSteps.length - 1) {
    brewStep = index + 1;
    document.getElementById('eq-' + brewSteps[brewStep].id).classList.remove('inactive');
    document.getElementById('tab-' + brewSteps[brewStep].id).classList.add('active');
    setMessage(`✅ ${brewSteps[index].label} done! Now: <strong>${brewSteps[brewStep].label}</strong> — ${brewSteps[brewStep].desc}`);
  } else {
    // Complete!
    brewScore += 50; // keg bonus
    updateScore();
    setMessage('<span class="ok">🍺 Keg filled! +50L bonus.</span> Reset to brew again!');
    // Reset chain for continuous play
    setTimeout(() => {
      brewStep = 0;
      brewSteps.forEach((s, i) => {
        brewStepStates[s.id] = false;
        const eq = document.getElementById('eq-' + s.id);
        eq.classList.remove('active');
        eq.classList.add(i === 0 ? '' : 'inactive');
        document.getElementById('liquid-' + s.id).classList.remove('filling');
        document.getElementById('tab-' + s.id).classList.remove('done');
        document.getElementById('tab-' + s.id).classList.toggle('active', i === 0);
        if (s.control === 'lever') document.getElementById('lever-' + s.id)?.classList.remove('pulled');
        if (s.control === 'toggle') document.getElementById('toggle-' + s.id)?.classList.remove('on');
        if (s.control === 'button') { const b = document.getElementById('btn-' + s.id); if(b){b.classList.remove('active');b.textContent='▶ START';} }
        if (i < brewSteps.length - 1) document.getElementById('pipe-' + i).classList.remove('flowing');
      });
      setMessage('<strong>New batch!</strong> Click the 🌾 Grain Silo to start.');
    }, 1500);
  }
}

// ─── Helpers ───
function selectStep(i) {
  document.querySelectorAll('.step-tab').forEach((t, idx) => {
    t.classList.toggle('active', idx === i && !brewStepStates[brewSteps[i].id]);
  });
}

function updateScore() {
  document.getElementById('score').textContent = brewScore + ' L';
}

function updateTimer() {
  const m = Math.floor(brewTimeLeft / 60);
  const s = brewTimeLeft % 60;
  document.getElementById('timer').textContent = m + ':' + s.toString().padStart(2, '0');
}

function setMessage(html) {
  document.getElementById('msg').innerHTML = html;
}

function spawnSteam(machineId) {
  const machine = document.getElementById(machineId);
  if (!machine) return;
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const steam = document.createElement('div');
      steam.className = 'steam';
      steam.style.left = (20 + Math.random() * 60) + 'px';
      steam.style.top = '-5px';
      machine.appendChild(steam);
      setTimeout(() => steam.remove(), 1500);
    }, i * 200);
  }
}

function darken(hex, amount) {
  let r = parseInt(hex.slice(1,3), 16);
  let g = parseInt(hex.slice(3,5), 16);
  let b = parseInt(hex.slice(5,7), 16);
  r = Math.max(0, r - amount);
  g = Math.max(0, g - amount);
  b = Math.max(0, b - amount);
  return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
}

function endGame() {
  brewActive = false;
  clearInterval(brewTimerInterval);
  const kegs = Math.floor(brewScore / 50);
  document.getElementById('final-score').textContent = brewScore + ' L';
  document.getElementById('final-k').textContent = kegs;
  document.getElementById('brew-celebrate').classList.add('show');
}

function brewReset() {
  if (brewTimerInterval) clearInterval(brewTimerInterval);
  initBrewGame();
}

function closeBrewery() {
  document.getElementById('brewery-overlay').style.display = 'none';
  if (brewTimerInterval) clearInterval(brewTimerInterval);
}

// Auto-init
initBrewGame();
</script>
</body>
</html>
