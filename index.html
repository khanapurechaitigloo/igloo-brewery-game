<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Igloo Brewery — Interactive Brew</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; touch-action: none; font-family: 'Segoe UI', system-ui, sans-serif; }
canvas { display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ─── CONFIG ───
const W = 1280, H = 768;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  const r = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.width = W; canvas.height = H;
  canvas.style.width = (W * r) + 'px';
  canvas.style.height = (H * r) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ─── COLORS ───
const C = {
  bg: '#1a1a2e', bgWall: '#22223a', bgFloor: '#2a2a40', bgLight: '#333355',
  pipe: '#555577', pipeActive: '#4a9eff',
  static: '#cdb18a', alert: '#cc2800', active: '#1A9900',
  gold: '#F7B744', teal: '#39959E', orange: '#E2A440',
  steel: '#888899', darkSteel: '#555566',
  text: '#cdb18a', white: '#ffffff'
};

// ─── GAME STATE ───
let gameState = 'menu'; // menu, game, result
let score = 0, displayScore = 0;
let timeLeft = 180, timerAcc = 0;
let scrollX = 0, targetScrollX = 0;
let comboTimer = 0, comboScore = 0;
let machines = [];
let particles = [];
let activeMachine = -1;

// ─── MACHINE DEFINITIONS ───
const MACHINE_DEFS = [
  { name: 'Malt Silo', icon: '🌾', color: '#F7B747', control: 'lever', x: 150 },
  { name: 'Milling', icon: '⚙️', color: '#c47a2c', control: 'power', x: 400 },
  { name: 'Mashing', icon: '💧', color: '#39959E', control: 'toggle', x: 650 },
  { name: 'Lautering', icon: '🔪', color: '#E2A440', control: 'toggle', x: 900 },
  { name: 'Boiling', icon: '🔥', color: '#E24422', control: 'power', x: 1150 },
  { name: 'Cooling', icon: '❄️', color: '#5599CC', control: 'toggle', x: 1400 },
  { name: 'Fermentation', icon: '🫧', color: '#88AA44', control: 'lever', x: 1650 },
  { name: 'Filtration', icon: '🔬', color: '#999999', control: 'power', x: 1900 },
  { name: 'Packaging', icon: '🍺', color: '#AA8833', control: 'speed', x: 2150 },
];

// ─── INIT MACHINES ───
function initMachines() {
  machines = MACHINE_DEFS.map((def, i) => ({
    ...def,
    index: i,
    progress: 0,
    maxProgress: 100,
    active: false,
    alertTimer: 0,
    leverPulled: false,
    toggleOn: false,
    powerCharged: 0,
    powerCharging: false,
    speed: 1,
    depleted: false,
    fillLevel: 0,
    steamTimer: 0,
  }));
}

// ─── DRAWING HELPERS ───
function drawRoundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function drawCircle(x, y, r, fill, stroke) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function drawText(text, x, y, size, color, align) {
  ctx.font = `bold ${size}px "Segoe UI", system-ui, sans-serif`;
  ctx.fillStyle = color || C.text;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

// ─── DRAW MACHINE ───
function drawMachine(m, screenX) {
  const mx = screenX;
  const my = 340;
  const mw = 100, mh = 140;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(mx, my + mh/2 + 20, mw/2, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Machine body
  const bodyGrad = ctx.createLinearGradient(mx - mw/2, my - mh/2, mx + mw/2, my + mh/2);
  bodyGrad.addColorStop(0, m.active ? lighten(m.color, 30) : '#3a3a4a');
  bodyGrad.addColorStop(1, m.active ? m.color : '#2a2a3a');
  drawRoundRect(mx - mw/2, my - mh/2, mw, mh, 8, bodyGrad, m.active ? '#ffd08a' : '#555');

  // Machine icon
  ctx.font = '36px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(m.icon, mx, my - 10);

  // Fill level (liquid inside)
  if (m.fillLevel > 0) {
    const fillH = (mh - 20) * (m.fillLevel / 100);
    ctx.fillStyle = m.color + '88';
    ctx.beginPath();
    ctx.roundRect(mx - mw/2 + 8, my + mh/2 - 8 - fillH, mw - 16, fillH, [0, 0, 4, 4]);
    ctx.fill();
  }

  // Progress bar
  const barW = mw - 10;
  const barH = 8;
  const barX = mx - barW / 2;
  const barY = my + mh/2 + 15;
  drawRoundRect(barX, barY, barW, barH, 3, '#222');
  if (m.progress > 0) {
    const pct = m.progress / m.maxProgress;
    const barColor = pct > 0.5 ? C.active : pct > 0.2 ? C.alert : C.alert;
    drawRoundRect(barX, barY, barW * pct, barH, 3, barColor);
  }

  // Alert indicator
  if (m.depleted && !m.active) {
    const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    drawCircle(mx, my - mh/2 - 15, 6, C.alert);
    ctx.globalAlpha = 1;
  }

  // Active indicator
  if (m.active) {
    ctx.shadowColor = m.color;
    ctx.shadowBlur = 15;
    drawCircle(mx, my - mh/2 - 15, 6, C.active);
    ctx.shadowBlur = 0;
  }

  // Controls
  drawControl(m, mx, my + mh/2 + 40);

  // Name
  drawText(m.name, mx, my - mh/2 - 35, 13, '#aaa');

  // Steam particles
  if (m.active && m.steamTimer > 0) {
    for (let i = 0; i < 3; i++) {
      const sx = mx - 20 + Math.random() * 40;
      const sy = my - mh/2 - 20 - Math.random() * 30;
      const sr = 3 + Math.random() * 5;
      ctx.globalAlpha = 0.3;
      drawCircle(sx, sy, sr, '#aabbcc');
      ctx.globalAlpha = 1;
    }
  }
}

function drawControl(m, cx, cy) {
  if (m.control === 'lever') {
    // Lever base
    drawRoundRect(cx - 8, cy - 20, 16, 40, 4, '#444', '#666');
    // Lever handle
    const ly = m.leverPulled ? cy + 10 : cy - 15;
    drawRoundRect(cx - 12, ly, 24, 10, 3, m.leverPulled ? '#4a9eff' : '#888');
    drawText('LEVER', cx, cy + 30, 9, '#777');
  } else if (m.control === 'toggle') {
    // Toggle switch
    const tw = 40, th = 22;
    drawRoundRect(cx - tw/2, cy - th/2, tw, th, th/2, m.toggleOn ? '#4a9eff' : '#333', '#666');
    drawCircle(cx + (m.toggleOn ? 9 : -9), cy, 8, '#ddd');
    drawText('TOGGLE', cx, cy + 25, 9, '#777');
  } else if (m.control === 'power') {
    // Power button
    const pr = 16;
    drawCircle(cx, cy, pr + 3, '#333', '#666');
    drawCircle(cx, cy, pr, m.powerCharging ? '#ff6644' : '#555');
    // Power icon
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 8);
    ctx.lineTo(cx, cy + 2);
    ctx.lineTo(cx + 5, cy + 2);
    ctx.lineTo(cx - 2, cy + 10);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx - 5, cy);
    ctx.stroke();
    drawText('POWER', cx, cy + 30, 9, '#777');
  } else if (m.control === 'speed') {
    // Speed control
    drawRoundRect(cx - 18, cy - 14, 36, 28, 4, '#333', '#666');
    drawText('▲', cx, cy - 6, 10, '#aaa');
    drawText(String(m.speed), cx, cy + 2, 14, C.gold);
    drawText('▼', cx, cy + 10, 10, '#aaa');
    drawText('SPEED', cx, cy + 28, 9, '#777');
  }
}

// ─── DRAW PIPE ───
function drawPipe(x1, x2, y, active) {
  ctx.fillStyle = active ? '#446688' : '#444466';
  ctx.fillRect(x1, y - 4, x2 - x1, 8);
  // Joints
  ctx.fillStyle = active ? '#557799' : '#555577';
  ctx.fillRect(x1 - 2, y - 6, 8, 12);
  ctx.fillRect(x2 - 6, y - 6, 8, 12);
  // Flow animation
  if (active) {
    const t = Date.now() / 300;
    for (let i = 0; i < 5; i++) {
      const fx = x1 + ((t + i * 0.2) % 1) * (x2 - x1);
      ctx.globalAlpha = 0.6;
      drawCircle(fx, y, 3, C.pipeActive);
      ctx.globalAlpha = 1;
    }
  }
}

// ─── DRAW BACKGROUND ───
function drawBackground() {
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#0d0d1a');
  skyGrad.addColorStop(0.6, '#1a1a2e');
  skyGrad.addColorStop(1, '#22223a');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Parallax back wall
  const wallOff = scrollX * 0.3;
  ctx.fillStyle = '#1e1e32';
  for (let i = 0; i < 15; i++) {
    const wx = (i * 200 - wallOff % 200) - 100;
    ctx.fillRect(wx, 100, 160, 400);
    // Windows
    for (let wy = 0; wy < 4; wy++) {
      ctx.fillStyle = Math.random() > 0.5 ? '#333355' : '#2a2a44';
      ctx.fillRect(wx + 20, 130 + wy * 80, 30, 40);
      ctx.fillRect(wx + 70, 130 + wy * 80, 30, 40);
      ctx.fillRect(wx + 120, 130 + wy * 80, 30, 40);
    }
    ctx.fillStyle = '#1e1e32';
  }

  // Parallax mid wall
  const midOff = scrollX * 0.6;
  ctx.fillStyle = '#252540';
  for (let i = 0; i < 10; i++) {
    const wx = (i * 280 - midOff % 280) - 140;
    ctx.fillRect(wx, 180, 220, 350);
    // Pipes on wall
    ctx.fillStyle = '#333350';
    ctx.fillRect(wx + 10, 200, 200, 6);
    ctx.fillRect(wx + 10, 350, 200, 6);
    ctx.fillStyle = '#252540';
  }

  // Floor
  const floorGrad = ctx.createLinearGradient(0, 520, 0, H);
  floorGrad.addColorStop(0, '#2a2a44');
  floorGrad.addColorStop(1, '#1e1e36');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, 520, W, H - 520);

  // Floor tiles
  const tileOff = scrollX * 1.0;
  ctx.strokeStyle = '#333350';
  ctx.lineWidth = 1;
  for (let i = -1; i < 30; i++) {
    const tx = (i * 80 - tileOff % 80);
    ctx.beginPath();
    ctx.moveTo(tx, 520);
    ctx.lineTo(tx, H);
    ctx.stroke();
  }
  for (let j = 0; j < 4; j++) {
    ctx.beginPath();
    ctx.moveTo(0, 520 + j * 65);
    ctx.lineTo(W, 520 + j * 65);
    ctx.stroke();
  }

  // Hanging lights
  const lightOff = scrollX * 0.8;
  for (let i = 0; i < 8; i++) {
    const lx = (i * 180 + 90 - lightOff % 180);
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(lx, 0);
    ctx.lineTo(lx, 60);
    ctx.stroke();
    // Light glow
    const glowGrad = ctx.createRadialGradient(lx, 70, 5, lx, 70, 80);
    glowGrad.addColorStop(0, 'rgba(255,220,150,0.15)');
    glowGrad.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(lx - 80, 60, 160, 160);
    // Bulb
    drawCircle(lx, 70, 8, '#ffdd99');
  }
}

// ─── DRAW UI ───
function drawUI() {
  // Header bar
  ctx.fillStyle = 'rgba(13,13,26,0.9)';
  ctx.fillRect(0, 0, W, 55);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 55); ctx.lineTo(W, 55); ctx.stroke();

  // Title
  drawText('🍺 Igloo Brewery — Interactive Brew', 250, 28, 18, C.gold);

  // Score
  drawText(`${Math.floor(displayScore)} L`, W - 180, 28, 20, C.active, 'right');

  // Timer
  const tm = Math.floor(timeLeft / 60);
  const ts = Math.floor(timeLeft % 60);
  const timerStr = `${tm}:${ts.toString().padStart(2, '0')}`;
  drawText(timerStr, W - 60, 28, 22, timeLeft < 30 ? C.alert : '#ff6b6b', 'right');

  // Progress steps at top
  const stepY = 65;
  const stepW = W / machines.length;
  machines.forEach((m, i) => {
    const sx = stepW * i + stepW / 2;
    // Circle
    const circleColor = m.active ? C.active : m.depleted ? C.alert : '#444';
    drawCircle(sx, stepY, 14, circleColor);
    // Icon
    ctx.font = '14px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(m.icon, sx, stepY);
    // Label
    drawText(m.name, sx, stepY + 22, 9, m.active ? '#fff' : '#777');
    // Connection line
    if (i < machines.length - 1) {
      const pipeActive = m.active && machines[i + 1].active;
      ctx.strokeStyle = pipeActive ? C.pipeActive : '#444';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx + 16, stepY);
      ctx.lineTo(sx + stepW - 16, stepY);
      ctx.stroke();
    }
  });

  // Message bar at bottom
  ctx.fillStyle = 'rgba(13,13,26,0.9)';
  ctx.fillRect(0, H - 45, W, 45);
  ctx.strokeStyle = '#333';
  ctx.beginPath(); ctx.moveTo(0, H - 45); ctx.lineTo(W, H - 45); ctx.stroke();

  const activeIdx = machines.findIndex(m => !m.active && !m.depleted) >= 0
    ? machines.findIndex(m => !m.active && m.progress < 100)
    : 0;
  const nextMachine = machines[activeIdx] || machines[0];
  drawText(`Click ${nextMachine.icon} ${nextMachine.name} to operate`, W / 2, H - 22, 13, '#aaa');

  // Combo indicator
  const allActive = machines.every(m => m.active);
  if (allActive) {
    const pulse = Math.sin(Date.now() / 150) * 0.2 + 0.8;
    ctx.globalAlpha = pulse;
    drawText('🔥 COMBO! All machines running! +5x Score', W / 2, H - 65, 16, '#ffd08a');
    ctx.globalAlpha = 1;
  }
}

// ─── DRAW MENU ───
function drawMenu() {
  drawBackground();

  // Title card
  drawRoundRect(W/2 - 250, 180, 500, 300, 20, 'rgba(13,13,26,0.95)', '#c47a2c');
  drawText('🍺 Igloo Brewery', W/2, 260, 36, C.gold);
  drawText('Interactive Brew Game', W/2, 305, 20, '#aaa');

  // Play button
  drawRoundRect(W/2 - 80, 360, 160, 50, 10, '#c47a2c');
  drawText('▶ PLAY', W/2, 385, 22, '#fff');

  drawText('Manage the brewery supply chain!', W/2, 440, 14, '#777');
  drawText('Keep all machines running to produce beer.', W/2, 460, 12, '#555');
}

// ─── DRAW RESULT ───
function drawResult() {
  drawBackground();
  drawRoundRect(W/2 - 250, 150, 500, 350, 20, 'rgba(13,13,26,0.95)', '#c47a2c');
  drawText("⏱️ Time's Up!", W/2, 220, 32, C.gold);
  drawText(`${Math.floor(score)} L`, W/2, 290, 52, C.active);
  drawText(`${Math.floor(score / 50)} kegs produced`, W/2, 340, 18, '#aaa');

  // Replay button
  drawRoundRect(W/2 - 80, 390, 160, 50, 10, '#c47a2c');
  drawText('🔄 BREW AGAIN', W/2, 415, 20, '#fff');
}

// ─── UPDATE ───
function update(dt) {
  if (gameState !== 'game') return;

  // Timer
  timerAcc += dt;
  if (timerAcc >= 1) {
    timeLeft--;
    timerAcc -= 1;
    if (timeLeft <= 0) { gameState = 'result'; return; }
  }

  // Scroll smoothing
  scrollX += (targetScrollX - scrollX) * 0.1;

  // Machine updates
  let allActive = true;
  machines.forEach((m, i) => {
    // Progress depletion
    if (m.active) {
      m.progress -= dt * (8 + m.speed * 3);
      m.fillLevel = Math.max(0, m.fillLevel - dt * 5);
      m.steamTimer = 1;
      if (m.progress <= 0) {
        m.progress = 0;
        m.active = false;
        m.depleted = true;
        m.leverPulled = false;
        m.toggleOn = false;
        m.powerCharging = false;
      }
    } else {
      allActive = false;
      m.steamTimer = 0;
    }

    // Power charging
    if (m.powerCharging && m.control === 'power') {
      m.powerCharged += dt * 40;
      if (m.powerCharged >= 100) {
        m.powerCharged = 0;
        m.powerCharging = false;
        activateMachine(i);
      }
    }

    // Fill animation
    if (m.active) {
      m.fillLevel = Math.min(100, m.fillLevel + dt * 20);
    }
  });

  // Combo
  if (allActive) {
    comboTimer += dt;
    if (comboTimer >= 1) {
      score += 15 * machines[0].speed;
      comboTimer = 0;
    }
  } else {
    comboTimer = 0;
  }

  // Score display smoothing
  displayScore += (score - displayScore) * 0.1;

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    return p.life > 0;
  });
}

function activateMachine(i) {
  machines[i].active = true;
  machines[i].depleted = false;
  machines[i].progress = 100;
  machines[i].fillLevel = 50;
  score += 10;

  // Particles
  for (let j = 0; j < 8; j++) {
    particles.push({
      x: machines[i].x - scrollX,
      y: 340,
      vx: (Math.random() - 0.5) * 200,
      vy: -Math.random() * 150 - 50,
      life: 0.5 + Math.random() * 0.5,
      color: machines[i].color,
    });
  }
}

// ─── RENDER ───
function render() {
  ctx.clearRect(0, 0, W, H);

  if (gameState === 'menu') { drawMenu(); return; }
  if (gameState === 'result') { drawResult(); return; }

  drawBackground();

  // Draw pipes between machines
  machines.forEach((m, i) => {
    if (i < machines.length - 1) {
      const x1 = m.x - scrollX + 55;
      const x2 = machines[i + 1].x - scrollX - 55;
      drawPipe(x1, x2, 410, m.active && machines[i + 1].active);
    }
  });

  // Draw machines
  machines.forEach(m => {
    const sx = m.x - scrollX;
    if (sx > -150 && sx < W + 150) {
      drawMachine(m, sx);
    }
  });

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    drawCircle(p.x, p.y, 4, p.color);
    ctx.globalAlpha = 1;
  });

  drawUI();
}

// ─── INPUT ───
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  if (gameState === 'menu') {
    if (mx > W/2 - 80 && mx < W/2 + 80 && my > 360 && my < 410) {
      gameState = 'game';
      score = 0; displayScore = 0; timeLeft = 180; timerAcc = 0;
      scrollX = 0; targetScrollX = 0;
      initMachines();
    }
    return;
  }

  if (gameState === 'result') {
    if (mx > W/2 - 80 && mx < W/2 + 80 && my > 390 && my < 440) {
      gameState = 'menu';
    }
    return;
  }

  // Game click
  machines.forEach((m, i) => {
    const sx = m.x - scrollX;
    const my2 = 340;

    // Machine click area
    if (mx > sx - 60 && mx < sx + 60 && my > my2 - 80 && my < my2 + 100) {
      if (m.control === 'lever') {
        m.leverPulled = !m.leverPulled;
        if (m.leverPulled) activateMachine(i);
      } else if (m.control === 'toggle') {
        m.toggleOn = !m.toggleOn;
        if (m.toggleOn) activateMachine(i);
      } else if (m.control === 'power') {
        m.powerCharging = true;
      } else if (m.control === 'speed') {
        // Check if clicked on up or down
        if (my < my2 + 40) {
          m.speed = Math.min(3, m.speed + 1);
        } else {
          m.speed = Math.max(1, m.speed - 1);
        }
        if (m.speed >= 2) activateMachine(i);
      }
    }
  });

  // Scroll arrows
  if (mx < 60) targetScrollX = Math.min(0, targetScrollX + 200);
  if (mx > W - 60) targetScrollX = Math.max(-900, targetScrollX - 200);
});

// Power button release
canvas.addEventListener('mouseup', () => {
  machines.forEach(m => {
    if (m.control === 'power') m.powerCharging = false;
  });
});

// Touch scroll
let touchStartX = 0, touchScrollStart = 0;
canvas.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchScrollStart = targetScrollX;
});
canvas.addEventListener('touchmove', (e) => {
  const dx = e.touches[0].clientX - touchStartX;
  targetScrollX = Math.max(-900, Math.min(0, touchScrollStart + dx * 0.5));
  e.preventDefault();
});

// ─── GAME LOOP ───
let lastTime = 0;
function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

initMachines();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
