<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H,sc;
function resize(){
  W=innerWidth;H=innerHeight;
  C.width=W;C.height=H;
  sc=W/1280; // base scale
}
resize();addEventListener('resize',resize);

// ─── CONFIG ───
const GAME_W=2800;
const MACHINES=[
  {id:'silo',name:'Malt Silo',icon:'🌾',color:'#F7B747',ctrl:'lever'},
  {id:'mill',name:'Milling',icon:'⚙️',color:'#c47a2c',ctrl:'hold'},
  {id:'mash',name:'Mashing',icon:'💧',color:'#39959E',ctrl:'dual'},
  {id:'lauter',name:'Lautering',icon:'🔪',color:'#E2A440',ctrl:'dual'},
  {id:'boil',name:'Boiling',icon:'🔥',color:'#E24422',ctrl:'hold'},
  {id:'cool',name:'Cooling',icon:'❄️',color:'#5599CC',ctrl:'dual'},
  {id:'ferment',name:'Fermentation',icon:'🫧',color:'#88AA44',ctrl:'lever'},
  {id:'filter',name:'Filtration',icon:'🔬',color:'#999999',ctrl:'lever'},
  {id:'package',name:'Packaging',icon:'🍺',color:'#AA8833',ctrl:'lever'},
];

let state='menu',score=0,dispScore=0,timeLeft=180,timerAcc=0;
let scrollX=0,tScrollX=0,touchSX=0,touchSSX=0;
let machines=[],particles=[],gt=0,activeIdx=0;
let msg='Pull Silo lever to start!';let L=getLayout();
let isMobile='ontouchstart'in window;

function init(){
  machines=MACHINES.map((m,i)=>({...m,idx:i,fill:0,process:0,active:false,done:false,
    lever:false,hold:0,holding:false,togL:false,togR:false,bal:0.5,depleted:false,shake:0,grain:[]}));
  score=0;dispScore=0;timeLeft=180;timerAcc=0;scrollX=0;tScrollX=0;particles=[];gt=0;activeIdx=0;
  msg='Pull 🌾 Silo lever to start!';
}

// ─── HELPERS ───
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return a+Math.random()*(b-a)}
function lighten(h,n){let r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return'#'+[Math.min(255,r+n),Math.min(255,g+n),Math.min(255,b+n)].map(c=>c.toString(16).padStart(2,'0')).join('');}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();}
function frr(x,y,w,h,r,c){rr(x,y,w,h,r);X.fillStyle=c;X.fill();}
function srr(x,y,w,h,r,c,lw){rr(x,y,w,h,r);X.strokeStyle=c;X.lineWidth=lw||2;X.stroke();}
function txt(s,x,y,sz,c,a){X.font='bold '+sz+'px "Segoe UI",system-ui,sans-serif';X.fillStyle=c||'#cdb18a';X.textAlign=a||'center';X.textBaseline='middle';X.fillText(s,x,y);}

// ─── LAYOUT (responsive) ───
function getLayout(){
  const topBar=50;
  const stepBar=45;
  const botBar=55;
  const machineArea=H-topBar-stepBar-botBar;
  const machineY=topBar+stepBar+machineArea*0.35;
  const controlY=machineY+machineArea*0.32;
  const machineSize=Math.min(120,machineArea*0.28);
  const ctrlSize=Math.min(80,machineArea*0.2);
  const spacing=Math.min(280,W/3.2);
  const startX=W*0.18;
  return{topBar,stepBar,botBar,machineY,controlY,machineSize,ctrlSize,spacing,startX};
}

// ─── DRAW ───
function drawBG(){
  const sg=X.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'#0a0a18');sg.addColorStop(0.6,'#151528');sg.addColorStop(1,'#1e1e36');
  X.fillStyle=sg;X.fillRect(0,0,W,H);

  // Simple buildings
  for(let i=0;i<8;i++){
    const bx=i*(W/6)-scrollX*0.3%(W/6);
    X.fillStyle='#1a1a30';X.fillRect(bx,40,W/7,H*0.6);
    for(let j=0;j<4;j++){
      X.fillStyle='#222244';X.fillRect(bx+W/7*0.15,60+j*80,W/7*0.2,35);
      X.fillStyle='#2a2a50';X.fillRect(bx+W/7*0.45,60+j*80,W/7*0.2,35);
    }
  }
  // Floor
  X.fillStyle='#1e1e36';X.fillRect(0,H*0.72,W,H*0.28);
  X.strokeStyle='#2a2a48';X.lineWidth=1;
  for(let i=0;i<W/50+1;i++){const tx=i*50-scrollX*0.8%50;X.beginPath();X.moveTo(tx,H*0.72);X.lineTo(tx,H);X.stroke();}

  // Lights
  for(let i=0;i<W/120+1;i++){
    const lx=i*120+60-scrollX*0.5%120;
    X.strokeStyle='#444';X.lineWidth=1;X.beginPath();X.moveTo(lx,0);X.lineTo(lx,35);X.stroke();
    const gl=X.createRadialGradient(lx,40,2,lx,40,50);
    gl.addColorStop(0,'rgba(255,220,150,0.1)');gl.addColorStop(1,'rgba(255,220,150,0)');
    X.fillStyle=gl;X.fillRect(lx-50,30,100,100);
    X.beginPath();X.arc(lx,40,5,0,Math.PI*2);X.fillStyle='#ffdd99';X.fill();
  }
}

function drawMachine(m,L){
  const sx=L.startX+m.idx*L.spacing-scrollX;
  if(sx<-150||sx>W+150)return;
  const mx=sx,my=L.machineY,mw=L.machineSize,mh=L.machineSize*1.1;

  // Shadow
  X.fillStyle='rgba(0,0,0,0.2)';
  X.beginPath();X.ellipse(mx,my+mh/2+10,mw/2+5,8,0,0,Math.PI*2);X.fill();

  // Body
  const bg=X.createLinearGradient(mx-mw/2,my-mh/2,mx+mw/2,my+mh/2);
  bg.addColorStop(0,m.active?lighten(m.color,40):'#4a4a5a');
  bg.addColorStop(1,m.active?m.color:'#333344');
  frr(mx-mw/2,my-mh/2,mw,mh,10,bg);
  srr(mx-mw/2,my-mh/2,mw,mh,10,m.active?'#ffd08a':m.done?'#7dde92':'#555566',3);

  // Fill
  if(m.fill>0){
    const fH=(mh-16)*(m.fill/100);
    X.save();X.beginPath();X.rect(mx-mw/2+4,my-mh/2+4,mw-8,mh-8);X.clip();
    frr(mx-mw/2+4,my+mh/2-4-fH,mw-8,fH,0,m.color+'88');
    X.restore();
  }

  // Icon
  X.font=(mw*0.3)+'px serif';X.textAlign='center';X.textBaseline='middle';
  X.fillText(m.icon,mx,my-5);

  // Status
  const ly=my-mh/2-14;
  if(m.depleted&&!m.active){const p=Math.sin(gt*5)*0.3+0.7;X.globalAlpha=p;X.beginPath();X.arc(mx,ly,8,0,Math.PI*2);X.fillStyle='#cc2800';X.fill();X.globalAlpha=1;}
  else if(m.active){X.shadowColor='#1A9900';X.shadowBlur=12;X.beginPath();X.arc(mx,ly,8,0,Math.PI*2);X.fillStyle='#1A9900';X.fill();X.shadowBlur=0;}
  else if(m.done){X.beginPath();X.arc(mx,ly,8,0,Math.PI*2);X.fillStyle='#7dde92';X.fill();}

  // Name
  txt(m.name,mx,my-mh/2-28,Math.max(11,mw*0.11),m.idx===activeIdx?'#ffd08a':'#888');

  // Process bar
  const bw=mw-10,bh=6;
  frr(mx-bw/2,my+mh/2-10,bw,bh,3,'#1a1a2a');
  if(m.process>0)frr(mx-bw/2,my+mh/2-10,bw*(m.process/100),bh,3,m.active?'#1A9900':'#cc2800');

  // Grain fall
  m.grain.forEach(p=>{X.globalAlpha=0.8;X.beginPath();X.arc(sx+p.x,p.y,3,0,Math.PI*2);X.fillStyle=m.color;X.fill();X.globalAlpha=1;});
}

function drawControl(m,L){
  const sx=L.startX+m.idx*L.spacing-scrollX;
  if(sx<-150||sx>W+150)return;
  const cx=sx,cy=L.controlY,s=L.ctrlSize;
  const isNext=m.idx===activeIdx&&!m.active&&!m.done;

  if(m.ctrl==='lever'){
    // Big touch-friendly lever
    const lw=s*0.5,lh=s*0.8;
    frr(cx-lw/2,cy-lh/2,lw,lh,8,'#2a2a3a');
    srr(cx-lw/2,cy-lh/2,lw,lh,8,m.lever?'#4a9eff':'#666',3);
    const ky=m.lever?cy+lh*0.25:cy-lh*0.3;
    frr(cx-lw*0.6,ky,lw*1.2,lh*0.25,6,m.lever?'#4a9eff':'#bbb');
    if(isNext){X.shadowColor='#ffd08a';X.shadowBlur=12+Math.sin(gt*4)*8;srr(cx-lw/2-4,cy-lh/2-4,lw+8,lh+8,10,'#ffd08a',3);X.shadowBlur=0;}
    txt('PULL',cx,cy+lh/2+16,Math.max(12,s*0.18),'#aaa');
  }else if(m.ctrl==='hold'){
    // Big power button
    const pr=s*0.38;
    X.beginPath();X.arc(cx,cy,pr+4,0,Math.PI*2);X.fillStyle='#2a2a3a';X.fill();
    X.strokeStyle='#666';X.lineWidth=3;X.stroke();
    const isCharging=m.hold||m.hold>0;
    X.beginPath();X.arc(cx,cy,pr,0,Math.PI*2);
    X.fillStyle=isCharging?'#ff6644':'#555';X.fill();
    // Bolt
    X.strokeStyle='#fff';X.lineWidth=Math.max(2,pr*0.1);X.beginPath();
    X.moveTo(cx+pr*0.1,cy-pr*0.4);X.lineTo(cx-pr*0.1,cy);X.lineTo(cx+pr*0.15,cy);
    X.lineTo(cx-pr*0.1,cy+pr*0.4);X.lineTo(cx+pr*0.05,cy+pr*0.05);X.lineTo(cx-pr*0.12,cy+pr*0.05);X.stroke();
    // Charge bar
    if(m.hold>0){
      frr(cx-pr,cy+pr+10,pr*2,10,5,'#1a1a2a');
      frr(cx-pr,cy+pr+10,pr*2*(m.hold/100),10,5,'#ff6644');
    }
    if(isNext){X.shadowColor='#ffd08a';X.shadowBlur=12+Math.sin(gt*4)*8;X.beginPath();X.arc(cx,cy,pr+6,0,Math.PI*2);X.strokeStyle='#ffd08a';X.lineWidth=2;X.stroke();X.shadowBlur=0;}
    txt('HOLD',cx,cy+pr+30,Math.max(12,s*0.18),'#aaa');
  }else if(m.ctrl==='dual'){
    // Big toggle buttons
    const tw=s*0.4,th=s*0.5;
    // Left
    frr(cx-tw-8,cy-th/2,tw,th,10,m.togL?'#4a9eff':'#333');
    srr(cx-tw-8,cy-th/2,tw,th,10,m.togL?'#6ac0ff':'#666',2.5);
    txt('◀',cx-tw-8+tw/2,cy,Math.max(18,s*0.25),m.togL?'#fff':'#888');
    // Right
    frr(cx+8,cy-th/2,tw,th,10,m.togR?'#4a9eff':'#333');
    srr(cx+8,cy-th/2,tw,th,10,m.togR?'#6ac0ff':'#666',2.5);
    txt('▶',cx+8+tw/2,cy,Math.max(18,s*0.25),m.togR?'#fff':'#888');
    // Balance
    frr(cx-s*0.3,cy+th/2+8,s*0.6,10,5,'#1a1a2a');
    const bx=cx-s*0.3+s*0.6*m.bal;
    frr(bx-8,cy+th/2+6,16,14,7,m.bal>0.35&&m.bal<0.65?'#1A9900':'#ffd08a');
    if(isNext){X.shadowColor='#ffd08a';X.shadowBlur=12+Math.sin(gt*4)*8;srr(cx-s*0.3-8,cy-th/2-6,s*0.6+16,th+16,12,'#ffd08a',2);X.shadowBlur=0;}
    txt('ADJUST',cx,cy+th/2+30,Math.max(11,s*0.15),'#888');
  }
}

function drawPipes(L){
  for(let i=0;i<machines.length-1;i++){
    const x1=L.startX+i*L.spacing+L.machineSize/2-scrollX;
    const x2=L.startX+(i+1)*L.spacing-L.machineSize/2-scrollX;
    const y=L.machineY+L.machineSize*0.55;
    const fl=machines[i].done||machines[i].active;
    X.fillStyle=fl?'#446688':'#333350';X.fillRect(x1,y-5,x2-x1,10);
    X.fillStyle=fl?'#557799':'#444466';X.fillRect(x1-3,y-7,10,14);X.fillRect(x2-7,y-7,10,14);
    if(fl){const t=gt*1.5+i;for(let j=0;j<6;j++){const fx=x1+((t+j*0.17)%1)*(x2-x1);X.globalAlpha=0.6;X.beginPath();X.arc(fx,y,4,0,Math.PI*2);X.fillStyle='#4a9eff';X.fill();X.globalAlpha=1;}}
  }
}

function drawUI(L){
  // Top bar
  X.fillStyle='rgba(10,10,24,0.95)';X.fillRect(0,0,W,L.topBar);
  txt('🍺 Igloo Brewery',W*0.25,L.topBar/2,Math.min(20,W*0.035),'#ffd08a');
  txt(dispScore.toFixed(0)+' L',W-140,L.topBar/2,Math.min(22,W*0.04),'#1A9900','right');
  const m=Math.floor(timeLeft/60),s=Math.floor(timeLeft%60);
  txt(m+':'+s.toString().padStart(2,'0'),W-30,L.topBar/2,Math.min(24,W*0.045),timeLeft<30?'#cc2800':'#ff6b6b','right');

  // Step bar
  const sY=L.topBar+L.stepBar/2+4;
  const sW=W/machines.length;
  machines.forEach((m,i)=>{
    const sx=sW*i+sW/2;
    if(i<machines.length-1){X.strokeStyle=m.done?'#4a9eff':'#333';X.lineWidth=2;X.beginPath();X.moveTo(sx+sW*0.3,sY);X.lineTo(sx+sW*0.7,sY);X.stroke();}
    const cc=m.active?'#1A9900':m.depleted?'#cc2800':m.done?'#7dde92':i===activeIdx?'#ffd08a':'#444';
    X.beginPath();X.arc(sx,sY,13,0,Math.PI*2);X.fillStyle=cc;X.fill();
    if(i===activeIdx&&!m.done&&!m.active){X.strokeStyle='#ffd08a';X.lineWidth=2;X.stroke();}
    X.font='12px serif';X.textAlign='center';X.textBaseline='middle';X.fillText(m.icon,sx,sY);
  });

  // Bottom bar
  X.fillStyle='rgba(10,10,24,0.95)';X.fillRect(0,H-L.botBar,W,L.botBar);
  txt(msg,W/2,H-L.botBar/2,Math.min(14,W*0.025),'#ccc');

  // Scroll hint
  if(!isMobile){
    txt('← scroll →',W/2,L.topBar+L.stepBar+15,11,'#444');
  }
}

function drawMenu(){
  const L=getLayout();
  drawBG();
  const cw=Math.min(500,W*0.85),ch=Math.min(320,H*0.45);
  frr(W/2-cw/2,H*0.2,cw,ch,20,'rgba(10,10,24,0.95)');
  srr(W/2-cw/2,H*0.2,cw,ch,20,'#c47a2c',3);
  txt('🍺 Igloo Brewery',W/2,H*0.28,Math.min(36,W*0.06),'#ffd08a');
  txt('Interactive Brew Game',W/2,H*0.34,Math.min(20,W*0.035),'#aaa');
  const bw=180,bh=50;
  frr(W/2-bw/2,H*0.44,bw,bh,12,'#c47a2c');
  txt('▶ PLAY',W/2,H*0.44+bh/2,22,'#fff');
  txt('Manage the brewery supply chain!',W/2,H*0.58,Math.min(14,W*0.025),'#777');
  txt('Keep all machines running to brew beer.',W/2,H*0.62,Math.min(12,W*0.02),'#555');
}

function drawResult(){
  const L=getLayout();
  drawBG();
  const cw=Math.min(500,W*0.85),ch=Math.min(360,H*0.5);
  frr(W/2-cw/2,H*0.15,cw,ch,20,'rgba(10,10,24,0.95)');
  srr(W/2-cw/2,H*0.15,cw,ch,20,'#c47a2c',3);
  txt("⏱️ Time's Up!",W/2,H*0.22,Math.min(32,W*0.05),'#ffd08a');
  txt(score.toFixed(0)+' L',W/2,H*0.35,Math.min(52,W*0.08),'#1A9900');
  txt(Math.floor(score/50)+' kegs produced',W/2,H*0.42,Math.min(18,W*0.03),'#aaa');
  const bw=200,bh=50;
  frr(W/2-bw/2,H*0.55,bw,bh,12,'#c47a2c');
  txt('🔄 BREW AGAIN',W/2,H*0.55+bh/2,22,'#fff');
}

// ─── UPDATE ───
function update(dt){
  if(state!=='game')return;
  L=getLayout();
  gt+=dt;
  timerAcc+=dt;
  if(timerAcc>=1){timeLeft--;timerAcc-=1;if(timeLeft<=0){state='result';return;}}
  scrollX=lerp(scrollX,tScrollX,0.12);

  machines.forEach((m,i)=>{
    if(m.active){
      let speed=10+i*2;
      m.process-=dt*speed;
      m.fill=clamp(m.process,0,100);
      m.shake=Math.sin(gt*30)*1.2;
      if(m.process<=0){
        m.process=0;m.active=false;m.done=true;
        m.lever=false;m.togL=false;m.togR=false;m.holding=false;m.hold=0;m.fill=0;m.shake=0;
        score+=15;
        activeIdx=Math.min(i+1,machines.length-1);
        msg='✅ '+m.name+' done! → '+machines[activeIdx].icon+' '+machines[activeIdx].name;
        for(let j=0;j<12;j++) particles.push({x:L.startX+m.idx*L.spacing-scrollX+rnd(-30,30),y:L.machineY+rnd(-40,0),vx:rnd(-80,80),vy:rnd(-120,-30),life:rnd(0.4,0.9),color:m.color});
      }
    }
    if(m.id==='silo'&&m.lever&&m.active&&Math.random()<0.4) m.grain.push({x:rnd(-20,20),y:280});
    m.grain=m.grain.filter(p=>{p.y+=dt*130;return p.y<420;});
  });

  dispScore=lerp(dispScore,score,0.1);
  particles=particles.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt;return p.life>0;});
}

function activate(i){
  const m=machines[i];
  const prev=i>0?machines[i-1]:null;
  if(m.active||m.depleted)return;
  if(prev&&!prev.done&&i!==0)return;
  m.active=true;m.done=false;m.process=100;m.fill=100;
  if(m.ctrl==='lever')m.lever=true;
  if(m.ctrl==='dual'){m.bal=0.5;if(Math.random()>0.5)m.togL=true;else m.togR=true;}
  msg=m.icon+' '+m.name+' activated!';
  for(let j=0;j<8;j++) particles.push({x:L.startX+m.idx*L.spacing-scrollX+rnd(-20,20),y:L.machineY+rnd(-30,0),vx:rnd(-60,60),vy:rnd(-100,-20),life:rnd(0.3,0.6),color:m.color});
}

// ─── RENDER ───
function render(){
  const L=getLayout();
  X.clearRect(0,0,W,H);
  if(state==='menu'){drawMenu();return;}
  if(state==='result'){drawResult();return;}
  drawBG();drawPipes(L);
  machines.forEach(m=>drawMachine(m,L));
  machines.forEach(m=>drawControl(m,L));
  particles.forEach(p=>{X.globalAlpha=clamp(p.life*2,0,1);X.beginPath();X.arc(p.x,p.y,4,0,Math.PI*2);X.fillStyle=p.color;X.fill();X.globalAlpha=1;});
  drawUI(L);
}

// ─── INPUT ───
function handleTap(px,py){
  const L=getLayout();
  if(state==='menu'){
    const bw=180,bh=50;
    if(px>W/2-bw/2&&px<W/2+bw/2&&py>H*0.44&&py<H*0.44+bh){state='game';init();}
    return;
  }
  if(state==='result'){
    const bw=200,bh=50;
    if(px>W/2-bw/2&&px<W/2+bw/2&&py>H*0.55&&py<H*0.55+bh){state='menu';}
    return;
  }

  // Machine or control click
  machines.forEach((m,i)=>{
    const sx=L.startX+i*L.spacing-scrollX;
    const my=L.machineY,cy=L.controlY;
    const hitR=L.machineSize*0.7;

    // Click on machine or control area
    if(px>sx-hitR&&px<sx+hitR&&py>my-hitR&&py<cy+L.ctrlSize*0.6){
      if(m.ctrl==='lever'){
        if(!m.active&&!m.depleted){
          const prev=i>0?machines[i-1]:null;
          if(!prev||prev.done||i===0){activate(i);}
          else{msg='⏳ Wait for '+prev.icon+' '+prev.name+' first!';}
        }else if(m.active){
          m.lever=false;m.active=false;m.done=true;m.process=0;m.fill=0;
          activeIdx=i;msg=m.icon+' '+m.name+' stopped.';
        }
      }else if(m.ctrl==='hold'){
        if(!m.active&&!m.depleted){
          const prev=i>0?machines[i-1]:null;
          if(!prev||prev.done||i===0){m.holding=true;activate(i);}
          else{msg='⏳ Wait for '+prev.icon+' '+prev.name+' first!';}
        }else if(m.active){m.holding=true;}
      }else if(m.ctrl==='dual'){
        if(!m.active&&!m.depleted){
          const prev=i>0?machines[i-1]:null;
          if(!prev||prev.done||i===0){
            if(px<sx){m.togL=true;m.togR=false;}else{m.togR=true;m.togL=false;}
            activate(i);
          }else{msg='⏳ Wait for '+prev.icon+' '+prev.name+' first!';}
        }else if(m.active){
          if(px<sx){m.bal=Math.max(0,m.bal-0.15);m.togL=true;setTimeout(()=>{if(machines[i])machines[i].togL=false;},200);}
          else{m.bal=Math.min(1,m.bal+0.15);m.togR=true;setTimeout(()=>{if(machines[i])machines[i].togR=false;},200);}
        }
      }
    }
  });
}

C.addEventListener('mousedown',e=>{const r=C.getBoundingClientRect();handleTap(e.clientX-r.left,e.clientY-r.top);});
C.addEventListener('mouseup',()=>{machines.forEach(m=>{if(m.ctrl==='hold')m.holding=false;});});
C.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];handleTap(t.clientX-C.getBoundingClientRect().left,t.clientY-C.getBoundingClientRect().top);touchSX=t.clientX;touchSSX=tScrollX;},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];tScrollX=clamp(touchSSX+(t.clientX-touchSX),-(GAME_W-W),0);},{passive:false});
C.addEventListener('touchend',()=>{machines.forEach(m=>{if(m.ctrl==='hold')m.holding=false;});});

let lastT=0;
function loop(t){const dt=Math.min((t-lastT)/1000,0.05);lastT=t;update(dt);render();requestAnimationFrame(loop);}
init();requestAnimationFrame(loop);
</script>
</body>
</html>
